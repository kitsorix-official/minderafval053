<html lang="nl">
<head>
    <meta charset="UTF-8">

    <!-- Structured Data (JSON-LD) voor SEO & AI Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "404 - Pagina niet gevonden",
      "description": "De gezochte pagina op MinderAfval053 bestaat niet.",
      "mainEntity": {
        "@type": "CreativeWork",
        "name": "MinderAfval053 Rekentool",
        "url": "https://afval053.website/index.html#calculator"
      }
    }
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            green: '#2ecc71',
                            darkgreen: '#27ae60',
                            orange: '#e67e22',
                            darkorange: '#d35400',
                            dark: '#2c3e50',
                            light: '#f8f9fa'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-center p-6 md:p-12">
    
    <main class="max-w-2xl mx-auto text-center my-auto" aria-labelledby="main-heading">
        <!-- 404 Header -->
        <h1 id="main-heading" class="text-7xl font-black text-slate-300 mb-2 tracking-tighter">404</h1>
        <p class="text-2xl font-bold text-slate-900 mb-4 tracking-tight">Oeps! Deze pagina is niet gevonden.</p>
        <p class="mb-8 text-sm sm:text-base text-slate-500 max-w-md mx-auto">
            De pagina die je zoekt bestaat niet (meer). Test ondertussen je afvalkennis met deze korte vraag of ga direct terug naar de calculator.
        </p>

        <!-- Quiz Container -->
        <section aria-labelledby="quiz-heading" class="bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-200/60 mb-8 text-left">
            <h2 id="quiz-heading" class="text-base sm:text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                <span class="text-brand-orange">💡</span> Waar hoort een oude pizzadoos met vetvlekken?
            </h2>
            
            <div role="group" aria-labelledby="quiz-heading" class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm font-medium">
                <!-- gecorrigeerd: vette doos moet in de grijze bak -->
                <button onclick="checkAnswer(true)" aria-live="polite" class="p-4 border border-slate-200 rounded-xl hover:border-brand-green hover:bg-slate-50 transition-all text-left active:scale-[0.99]">
                    <span class="block font-bold text-slate-900">Grijze bak</span>
                    <span class="text-xs text-slate-500 font-normal">Restafval</span>
                </button>
                <button onclick="checkAnswer(false)" aria-live="polite" class="p-4 border border-slate-200 rounded-xl hover:border-brand-orange hover:bg-slate-50 transition-all text-left active:scale-[0.99]">
                    <span class="block font-bold text-slate-900">Blauwe bak</span>
                    <span class="text-xs text-slate-500 font-normal">Oud papier en karton</span>
                </button>
            </div>
            
            <!-- Dynamic Feedback Box -->
            <div id="feedback" aria-live="assertive" class="hidden mt-4 p-4 rounded-xl text-xs sm:text-sm leading-relaxed"></div>
        </section>

        <!-- Back to Home Button -->
        <a href="index.html#calculator" class="inline-flex items-center justify-center bg-brand-green hover:bg-brand-darkgreen text-white font-bold py-3 px-8 rounded-xl shadow-sm transition-all text-sm focus:outline-none focus:ring-2 focus:ring-brand-green active:scale-95">
            Naar de afval-rekentool
        </a>
    </main>

    <!-- Quiz Logica en Correctie -->
    <script>
        function checkAnswer(isCorrect) {
            const feedback = document.getElementById('feedback');
            feedback.classList.remove('hidden');
            
            if (isCorrect) {
                feedback.className = "mt-4 p-4 rounded-xl font-medium bg-emerald-50 text-emerald-800 border border-emerald-100";
                feedback.innerText = "Helemaal goed! Door het vet en de etensresten kan het karton niet meer gerecycled worden. Vette pizzadozen horen dus in de grijze container. Alleen schone, droge kartonnen dozen mogen bij het oud papier.";
            } else {
                feedback.className = "mt-4 p-4 rounded-xl font-medium bg-orange-50 text-orange-800 border border-orange-100";
                feedback.innerText = "Helaas, dat is niet juist. Hoewel een pizzadoos van karton is, zorgen vetvlekken en etensresten voor problemen bij het recyclen. Daarom moet een vette pizzadoos altijd in de grijze bak voor restafval.";
            }
        }
    </script>
</body>
</html>
